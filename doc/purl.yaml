NAME: purl
VERSION: "0.2.1"
DESCRIPTION: >
  Transfer data from URLs with colored output, timing, redirects, auth, and JSON formatting. Pure Python alternative to curl. Prints response body to stdout by default or saves to a file with -o/--output. Supports HTTP verbs, custom headers, redirect following with chain display, Basic auth, response timing, JSON pretty-printing, and @file/@- body syntax.
USAGE:
  - "purl [OPTIONS] URL"
  - "purl https://example.com"
  - "purl -i https://api.github.com"
  - "purl -X POST -d '{\"key\": \"value\"}' https://api.example.com"
  - "purl -d @payload.json https://api.example.com"
OPTIONS:
  - "-h, --help              Show help message"
  - "-v, --version           Show version information"
  - "-X, --request METHOD    HTTP method (GET, POST, PUT, DELETE, PATCH, HEAD)"
  - "-H, --header HEADER     Add header (repeatable, e.g. -H 'Accept: application/json')"
  - "-d, --data DATA         Request body (implies POST); use @file or @- for stdin"
  - "-o, --output FILE       Save response body to file"
  - "-i, --include           Show response headers"
  - "-L, --location          Follow redirects (up to 30)"
  - "-u, --user USER:PASS    Basic authentication"
  - "-f, --fail              Exit 22 on HTTP 4xx/5xx (silent server errors)"
  - "-j, --json              Pretty-print JSON response"
  - "--timeout SECONDS       Request timeout (default: 30)"
  - "--verbose               Show request, response headers, timing, and redirects"
  - "--no-color              Disable colored output"
  - "--no-verify-ssl         Skip SSL certificate verification"
EXAMPLES:
  - "purl https://api.github.com                                       # GET with auto-https"
  - "purl -i https://httpbin.org/get                                   # Show response headers"
  - "purl --verbose -j https://httpbin.org/get                         # Verbose + pretty JSON"
  - "purl -X POST -d '{\"name\":\"test\"}' https://httpbin.org/post    # POST JSON"
  - "purl -d @data.json https://api.example.com                        # Body from file"
  - "echo '{\"x\":1}' | purl -d @- https://httpbin.org/post            # Body from stdin"
  - "purl -L https://httpbin.org/redirect/3                            # Follow redirects"
  - "purl -u admin:secret https://httpbin.org/basic-auth/admin/secret  # Basic auth"
  - "purl -f https://httpbin.org/status/404                            # Fail on 4xx/5xx"
  - "purl -o page.html https://example.com                             # Save to file"
OUTPUT: >
  Response body printed to stdout (or saved with -o). Headers and diagnostics go to stderr. Exit 0 on success, 1 on network/connection error, 22 on HTTP error with --fail.
AUTHOR: "@spacemany2k38"
DATE: "2025-12-27"
NOTES:
  - "URLs without scheme get https:// prepended automatically."
  - "-d implies POST unless -X is explicitly set."
  - "Use @filename to read body from a file, @- to read from stdin."
  - "Response timing is color-coded: green (<100ms), yellow (<500ms), red (>=500ms)."
  - "Status codes are color-coded: 2xx green, 3xx cyan, 4xx yellow, 5xx red."
  - "With --fail, exit code 22 mirrors curl's behavior for server errors."
  - "Redirect chain is displayed in verbose mode showing each hop."
